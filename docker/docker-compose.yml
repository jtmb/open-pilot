services:
  web:
    build:
      context: ../apps/web
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3002
      - CODE_SERVER_URL=http://code-server:8080
      - CODE_SERVER_BRIDGE_URL=http://code-server:3001
      - DATABASE_URL=postgresql://openpilot:changeme@postgres:5432/openpilot
    env_file:
      - ../apps/web/.env
    volumes:
      - ../apps/web/.env:/.env
      - /var/run/docker.sock:/var/run/docker.sock
      - copilot-auth:/copilot-auth
      - openpilot-data:/data
    depends_on:
      code-server:
        condition: service_started
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=openpilot
      - POSTGRES_USER=openpilot
      - POSTGRES_PASSWORD=changeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpilot -d openpilot"]
      interval: 5s
      timeout: 5s
      retries: 12
  code-server:
    build:
      context: .
      dockerfile: code-server.Dockerfile
    environment:
      - PASSWORD=changeme
    volumes:
      - ./:/home/coder/project
      - copilot-auth:/home/coder/.local/share/code-server/User/globalStorage/github.copilot
      - ./code-server-settings.json:/home/coder/.local/share/code-server/User/settings.json:ro
      - ./copilot-bridge:/home/coder/.local/share/code-server/extensions/copilot-bridge
    ports:
      - "8080:8080"
      - "3001:3001"
      - "4000-4019:4000-4019"  # preview port pool (one per concurrent run)
    command: ["--auth", "password", "--port", "8080", "/home/coder/project"]

volumes:
  copilot-auth: {}
  openpilot-data: {}
  postgres-data: {}


